{{- if and .Values.secretEnv (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atm.fullname" . }}-env
  labels: {{- include "atm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.imageCredentials.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atm.fullname" . }}-pull
  labels: {{- include "atm.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.imageCredentials.registry (dict "username" .Values.imageCredentials.username "password" .Values.imageCredentials.password "auth" (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc))) | toJson | b64enc }}
{{- end }}
