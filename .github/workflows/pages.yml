name: Site - build and deploy to GitHub Pages

# Builds the public website (marketing page + docs) with `npm run site:build` and
# publishes site/dist to GitHub Pages. The reference docs are generated from
# src/lib/docs-content, so changes there redeploy the site too.
#
# Screenshots are not taken here: they're committed under site/public/screenshots
# by `npm run demo:seed && npm run demo:screenshots` (see scripts/demo/).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/**"
      - "src/lib/docs-content/**"
      - "src/lib/mcp/tools.ts"
      - "src/app/icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
