name: Image - build and push to GHCR

# Builds the app image on merge to main (skipping pushes that only touch the
# chart, deploy or website files) and on demand, and pushes it to the GitHub
# Container Registry under this repository's owner:
#
#   ghcr.io/<owner>/ai-task-manager
#
# One image serves every service in docker-compose.yml (migrate, app, worker,
# integrations); they differ only by command. The public installer
# (site/install.sh) pulls `latest`, so the package should be public.
#
# It's multi-arch: each platform is built natively on its own runner (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm, so Apple Silicon and Graviton
# need no emulation) and pushed as `sha-<short sha>-<arch>`. The manifest job
# then joins them into one index tagged `latest` and `sha-<short sha>`. Deploy
# the plain sha tag so a rollout is pinned to one commit.
#
# Every push therefore makes three package versions (two platform images and
# the index). Nine are kept, i.e. the last three builds: roll back within
# those. Each platform's layer cache lives in the `ai-task-manager-buildcache`
# package under its own tag.
#
# Builds from main are then deployed: the job commits the new sha tag to the
# private GitOps repo (orangeballdev/obistack-gitops), which Argo CD watches.
# Nothing is committed back to this repo.

on:
  push:
    branches: [main]
    # Chart and deploy-only pushes don't change the image. Docs and Markdown
    # still build: they can carry updates for users.
    paths-ignore:
      - "charts/**"
      - "deploy/**"
      # The public website is built and hosted by pages.yml.
      - "site/**"
      - "scripts/site/**"
      - "scripts/demo/**"
  # Lets you build by hand: Actions -> Run workflow, or `gh workflow run images.yml`.
  workflow_dispatch:

permissions:
  contents: write # deploy step commits the new image tag
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Plain docker commands rather than the docker/* actions; buildx ships
      # on the runner. GHCR repository names must be lowercase.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-task-manager"
          cache="${image}-buildcache:${ARCH}"
          # The default docker driver cannot export a registry cache.
          docker buildx create --use --driver docker-container >/dev/null
          # provenance and sbom off: one plain manifest per platform, so each
          # package version is a whole image and the cleanup never deletes an
          # attestation that a kept image points at.
          docker buildx build . \
            --file Dockerfile \
            --platform "linux/${ARCH}" \
            --tag "${image}:sha-${GITHUB_SHA::7}-${ARCH}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --cache-from "type=registry,ref=${cache}" \
            --cache-to "type=registry,ref=${cache},mode=max,image-manifest=true" \
            --provenance=false \
            --sbom=false \
            --push

  manifest:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag latest and sha
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-task-manager"
          sha="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${sha}" \
            "${image}:${sha}-amd64" \
            "${image}:${sha}-arm64"
          docker buildx imagetools inspect "${image}:${sha}"

      # Point Argo CD at the image just pushed. Only for main, so a manual
      # build of another branch never deploys. The cluster's config lives in the
      # private GitOps repo orangeballdev/obistack-gitops: this commits the new tag
      # to values/ai-task-manager/production.yaml there, and Argo CD rolls it out.
      # GITOPS_DEPLOY_KEY is a write deploy key for that repo only. Without it (a
      # fork, say) the image is still published and the deploy is skipped.
      - name: Deploy to Argo CD
        if: github.ref == 'refs/heads/main'
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_DEPLOY_KEY}" ]; then
            echo "::notice::GITOPS_DEPLOY_KEY is not set, skipping the deploy"
            exit 0
          fi
          key="${RUNNER_TEMP}/gitops_key"
          printf '%s\n' "${GITOPS_DEPLOY_KEY}" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          tag="sha-${GITHUB_SHA::7}"
          values=values/ai-task-manager/production.yaml
          git clone --quiet --depth 1 git@github.com:orangeballdev/obistack-gitops.git "${RUNNER_TEMP}/gitops"
          cd "${RUNNER_TEMP}/gitops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retries on a push race with another app's deploy landing meanwhile.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i -E "s/^(  tag: ).*/\1${tag}/" "$values"
            if git diff --quiet; then
              echo "${values} already at ${tag}"
              exit 0
            fi
            git commit --quiet -am "Deploy ai-task-manager ${tag}" -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            if git push --quiet origin HEAD:main; then
              echo "Deployed ${tag}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), retrying"
            sleep $((attempt * 5))
          done
          echo "Could not push the image tag bump" >&2
          exit 1

      # GHCR has no retention policy of its own. Keep the newest nine
      # versions (the last three builds) and delete the rest.
      - name: Delete old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ai-task-manager
          package-type: container
          # Three versions per build (amd64, arm64, index): keeps the last three builds.
          min-versions-to-keep: 9

      # Each build overwrites its platform's cache tag and leaves the previous
      # cache behind untagged.
      - name: Delete old build caches
        uses: actions/delete-package-versions@v5
        with:
          package-name: ai-task-manager-buildcache
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0
