# Runs the prebuilt image from GHCR (multi-arch, built from main by
# .github/workflows/images.yml):
#
#   docker compose up -d                  # pull the image if missing, then start
#   docker compose pull && docker compose up -d   # update to the newest image
#   docker compose up --build -d          # build from this checkout instead
#
# AI_TASK_MANAGER_TAG pins a build (e.g. sha-c998d37; default latest) and
# AI_TASK_MANAGER_PORT picks the host port (default 3000).
#
# One image serves every service. Only `migrate` has a `build:`, and the others
# reuse its tag. Giving each service its own `build: .` built the same image
# four times per rebuild. A `--build` tags the local build with the same name,
# so a later `docker compose pull` replaces it with the published image again.
services:
  migrate:
    build: .
    image: ghcr.io/orangeballdev/ai-task-manager:${AI_TASK_MANAGER_TAG:-latest}
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: file:/data/dev.db
    volumes:
      - db_data:/data
    restart: "no"

  app:
    image: ghcr.io/orangeballdev/ai-task-manager:${AI_TASK_MANAGER_TAG:-latest}
    command: node .next/standalone/server.js
    environment:
      DATABASE_URL: file:/data/dev.db
      WORKSPACES_PATH: /workspaces
      # Pasted/attached images: must be on a volume the app (which stores uploads)
      # and the worker (which copies them into task workspaces) both mount.
      ATTACHMENTS_PATH: /data/attachments
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    ports:
      # AI_TASK_MANAGER_PORT picks another host port (the installer passes it through).
      - "${AI_TASK_MANAGER_PORT:-3000}:3000"
    volumes:
      - workspaces:/workspaces
      - db_data:/data
      - claude_home:/home/appuser/.claude
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ghcr.io/orangeballdev/ai-task-manager:${AI_TASK_MANAGER_TAG:-latest}
    command: npx tsx src/worker/index.ts
    # Reap orphaned git/esbuild children; npm as PID 1 leaves them as zombies.
    init: true
    environment:
      DATABASE_URL: file:/data/dev.db
      WORKSPACES_PATH: /workspaces
      # Pasted/attached images: must be on a volume the app (which stores uploads)
      # and the worker (which copies them into task workspaces) both mount.
      ATTACHMENTS_PATH: /data/attachments
      NODE_ENV: production
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}

    volumes:
      - workspaces:/workspaces
      - db_data:/data
      - claude_home:/home/appuser/.claude
      # Mount SSH keys so the worker can clone private repos
      - ~/.ssh:/home/appuser/.ssh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  integrations:
    image: ghcr.io/orangeballdev/ai-task-manager:${AI_TASK_MANAGER_TAG:-latest}
    command: npx tsx src/integrations/index.ts
    environment:
      DATABASE_URL: file:/data/dev.db
      NODE_ENV: production
    volumes:
      - db_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  workspaces:
  db_data:
  claude_home:
